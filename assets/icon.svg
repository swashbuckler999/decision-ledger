<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Decision Ledger">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f1a17"/>
      <stop offset="100%" stop-color="#0d0b0a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="#3a312c" stroke-width="4"/>

  <!-- three ledger entries: a decision, a rejection, a change request -->
  <g>
    <rect x="104" y="128" width="304" height="68" rx="16" fill="#241e1a" stroke="#3a312c" stroke-width="3"/>
    <rect x="104" y="128" width="14" height="68" rx="7" fill="#22c55e"/>
    <rect x="146" y="150" width="150" height="12" rx="6" fill="#e8e1da"/>
    <rect x="146" y="172" width="208" height="9" rx="4.5" fill="#7c7068"/>

    <rect x="104" y="222" width="304" height="68" rx="16" fill="#241e1a" stroke="#3a312c" stroke-width="3"/>
    <rect x="104" y="222" width="14" height="68" rx="7" fill="#ef4444"/>
    <rect x="146" y="244" width="116" height="12" rx="6" fill="#e8e1da"/>
    <rect x="146" y="266" width="186" height="9" rx="4.5" fill="#7c7068"/>

    <rect x="104" y="316" width="304" height="68" rx="16" fill="#241e1a" stroke="#3a312c" stroke-width="3"/>
    <rect x="104" y="316" width="14" height="68" rx="7" fill="#3b82f6"/>
    <rect x="146" y="338" width="138" height="12" rx="6" fill="#e8e1da"/>
    <rect x="146" y="360" width="166" height="9" rx="4.5" fill="#7c7068"/>
  </g>

  <!-- the accent spine: append-only, nothing removed -->
  <rect x="68" y="128" width="8" height="256" rx="4" fill="#d97757"/>
</svg>
