<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Decision Ledger — your repository remembers the code, this makes it remember why">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fdfcfb"/>
      <stop offset="55%" stop-color="#f7f4f1"/>
      <stop offset="100%" stop-color="#f1ece7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97757"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#44403c" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="20" fill="none" stroke="#e3dcd4" stroke-width="2"/>

  <!-- faint ruled-ledger lines -->
  <g stroke="#1c1917" stroke-opacity="0.05" stroke-width="1">
    <line x1="64" y1="104" x2="1216" y2="104"/>
    <line x1="64" y1="152" x2="1216" y2="152"/>
    <line x1="64" y1="200" x2="1216" y2="200"/>
    <line x1="64" y1="248" x2="1216" y2="248"/>
    <line x1="64" y1="296" x2="1216" y2="296"/>
  </g>
  <rect x="64" y="56" width="3" height="288" fill="url(#accent)" opacity="0.5"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="104" y="118" font-size="20" letter-spacing="7" fill="#a8683f" font-weight="600">CLAUDE CODE PLUGIN</text>
    <text x="100" y="212" font-size="82" font-weight="700" letter-spacing="-2.5" fill="#1c1917">Decision Ledger</text>
    <rect x="104" y="238" width="86" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="104" y="292" font-size="27" fill="#44403c">Your repository remembers the code.</text>
    <text x="104" y="330" font-size="27" fill="#1c1917" font-weight="650">This makes it remember <tspan fill="#c2410c" font-style="italic">why</tspan>.</text>
  </g>

  <!-- record cards -->
  <g filter="url(#card)" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace">
    <g transform="translate(800 70)">
      <rect width="400" height="74" rx="11" fill="#ffffff" stroke="#e7e0d8"/>
      <rect x="0" y="0" width="5" height="74" rx="2.5" fill="#16a34a"/>
      <text x="26" y="31" font-size="16" font-weight="700" fill="#15803d">ADR-0004</text>
      <text x="124" y="31" font-size="15" fill="#57534e">Parquet over CSV</text>
      <text x="26" y="56" font-size="12.5" fill="#78716c">load 41s → 2.3s · cost: no streaming reads</text>
    </g>
    <g transform="translate(800 163)">
      <rect width="400" height="74" rx="11" fill="#ffffff" stroke="#e7e0d8"/>
      <rect x="0" y="0" width="5" height="74" rx="2.5" fill="#dc2626"/>
      <text x="26" y="31" font-size="16" font-weight="700" fill="#b91c1c">REJ-0007</text>
      <text x="124" y="31" font-size="15" fill="#57534e">Threaded loader</text>
      <text x="26" y="56" font-size="12.5" fill="#78716c">client unsafe above 2 conns · do not re-propose</text>
    </g>
    <g transform="translate(800 256)">
      <rect width="400" height="74" rx="11" fill="#ffffff" stroke="#e7e0d8"/>
      <rect x="0" y="0" width="5" height="74" rx="2.5" fill="#2563eb"/>
      <text x="26" y="31" font-size="16" font-weight="700" fill="#1d4ed8">CR-0002</text>
      <text x="124" y="31" font-size="15" fill="#57534e">Ship read-only first</text>
      <text x="26" y="56" font-size="12.5" fill="#78716c">blast radius: 3 modules, 1 migration</text>
    </g>
  </g>
</svg>
