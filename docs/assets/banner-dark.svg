<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Decision Ledger — your repository remembers the code, this makes it remember why">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#15120f"/>
      <stop offset="55%" stop-color="#0f0d0c"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <linearGradient id="accentd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0916f"/>
      <stop offset="100%" stop-color="#d97757"/>
    </linearGradient>
    <linearGradient id="faded" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" rx="20" fill="url(#bgd)"/>
  <rect width="1280" height="400" rx="20" fill="none" stroke="#2b2522" stroke-width="2"/>

  <g stroke="#f5f0eb" stroke-opacity="0.045" stroke-width="1">
    <line x1="64" y1="104" x2="1216" y2="104"/>
    <line x1="64" y1="152" x2="1216" y2="152"/>
    <line x1="64" y1="200" x2="1216" y2="200"/>
    <line x1="64" y1="248" x2="1216" y2="248"/>
    <line x1="64" y1="296" x2="1216" y2="296"/>
  </g>
  <rect x="64" y="56" width="3" height="288" fill="url(#accentd)" opacity="0.55"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="104" y="118" font-size="20" letter-spacing="7" fill="#d9a184" font-weight="600">CLAUDE CODE PLUGIN</text>
    <text x="100" y="212" font-size="82" font-weight="700" letter-spacing="-2.5" fill="#f7f3ef">Decision Ledger</text>
    <rect x="104" y="238" width="86" height="5" rx="2.5" fill="url(#accentd)"/>
    <text x="104" y="292" font-size="27" fill="#b5aba3">Your repository remembers the code.</text>
    <text x="104" y="330" font-size="27" fill="#f7f3ef" font-weight="650">This makes it remember <tspan fill="#f0916f" font-style="italic">why</tspan>.</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Consolas, monospace">
    <g transform="translate(800 70)">
      <rect width="400" height="74" rx="11" fill="#1a1613" stroke="#332c27"/>
      <rect x="0" y="0" width="5" height="74" rx="2.5" fill="#22c55e"/>
      <text x="26" y="31" font-size="16" font-weight="700" fill="#4ade80">ADR-0004</text>
      <text x="124" y="31" font-size="15" fill="#c4bab2">Parquet over CSV</text>
      <text x="26" y="56" font-size="12.5" fill="#8b817a">load 41s → 2.3s · cost: no streaming reads</text>
    </g>
    <g transform="translate(800 163)">
      <rect width="400" height="74" rx="11" fill="#1a1613" stroke="#332c27"/>
      <rect x="0" y="0" width="5" height="74" rx="2.5" fill="#ef4444"/>
      <text x="26" y="31" font-size="16" font-weight="700" fill="#f87171">REJ-0007</text>
      <text x="124" y="31" font-size="15" fill="#c4bab2">Threaded loader</text>
      <text x="26" y="56" font-size="12.5" fill="#8b817a">client unsafe above 2 conns · do not re-propose</text>
    </g>
    <g transform="translate(800 256)">
      <rect width="400" height="74" rx="11" fill="#1a1613" stroke="#332c27"/>
      <rect x="0" y="0" width="5" height="74" rx="2.5" fill="#3b82f6"/>
      <text x="26" y="31" font-size="16" font-weight="700" fill="#60a5fa">CR-0002</text>
      <text x="124" y="31" font-size="15" fill="#c4bab2">Ship read-only first</text>
      <text x="26" y="56" font-size="12.5" fill="#8b817a">blast radius: 3 modules, 1 migration</text>
    </g>
  </g>
</svg>
